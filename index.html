<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PlayWithPride creates welcoming, inclusive opportunities for queer youth and allies to participate in sports, build confidence, and find community.">
  <title>PlayWithPride — Sports For Everyone</title>
  <style>
    :root {
      --ink:#17202a; --muted:#5b6570; --surface:#f6f4f2; --card:#fff;
      --accent:#ef7f24; --accent-dark:#c96313; --purple:#6d4aff;
      --border:#e4e0dc; --radius:22px; --shadow:0 14px 35px rgba(20,25,30,.08);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:#fff; line-height:1.6; overflow-x: hidden; }
    a { color:inherit; }
    img { max-width:100%; border-radius: var(--radius); }
    .container { width:min(1180px, calc(100% - 40px)); margin:auto; }
    .container-wide { width:min(1400px, calc(100% - 40px)); margin:auto; }
    .skip { position:absolute; left:-9999px; }
    .skip:focus { left:15px; top:15px; z-index:1000; background:#fff; padding:10px 15px; border-radius:8px; }

    header { position:sticky; top:0; z-index:100; background:rgba(255,255,255,.94); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    nav { min-height:76px; display:flex; align-items:center; justify-content:space-between; gap:25px; }
    .brand { text-decoration:none; display: flex; align-items: center; }
    .navlinks { display:flex; gap:22px; align-items:center; }
    .navlinks a { text-decoration:none; font-weight:650; font-size:.94rem; transition: color 0.2s; }
    .navlinks a:hover { color:var(--accent-dark); }
    
    /* ACTIVE PAGE INDICATOR */
    .navlinks a.active:not(.btn) { color:var(--accent); font-weight:900; font-size:1.05rem; }
    
    .menu { display:none; border:0; background:none; font-size:1.7rem; }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 20px; border-radius:999px; text-decoration:none; font-weight:800; border:2px solid transparent; cursor:pointer; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { background:var(--accent-dark); }
    .btn-outline { border-color:var(--ink); background:#fff; }
    .btn-outline:hover { background:var(--ink); color:#fff; }

    /* FADE-IN ANIMATIONS */
    .reveal { opacity: 0; transition: all 0.7s cubic-bezier(0.5, 0, 0, 1); }
    .reveal.active { opacity: 1; transform: translate(0, 0); }
    .fade-up { transform: translateY(30px); }
    .fade-left { transform: translateX(-30px); }
    .fade-right { transform: translateX(30px); }

    /* HERO STYLES */
    .hero { min-height:680px; display:flex; align-items:center; justify-content:flex-start; position:relative; overflow:hidden; padding-left: 5%; background:
      linear-gradient(90deg, rgba(16,20,25,.82), rgba(16,20,25,.43), rgba(16,20,25,.18)),
      url("https://drive.google.com/thumbnail?id=1r7ilCss50oR_IpSEzBVCVCzLqkuuNVst&sz=w1600") center/cover; color:#fff; }
    .hero:after { content:""; position:absolute; inset:auto 0 0; height:7px; background:linear-gradient(90deg,#f28c28,#ffd447,#57bd78,#39a7db,#7656d8,#e95b77); }
    .hero-content { max-width:780px; position:relative; z-index:1; text-align: left; }
    .eyebrow { text-transform:uppercase; letter-spacing:.15em; font-size:.8rem; font-weight:900; opacity:.9; }
    h1 { font-size:clamp(3rem,7vw,6.4rem); line-height:.95; letter-spacing:-.065em; margin:18px 0 25px; max-width:800px; }
    .hero p { font-size:clamp(1.1rem,2vw,1.35rem); max-width:680px; margin-bottom:30px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; }
    
    /* Hero Buttons */
    .hero .btn-primary { border: 1px solid #fff; }
    .hero .btn-outline { background: lightgray; color: var(--ink); border: 1px solid var(--ink); }
    .hero .btn-outline:hover { background: #fff; }

    .section-head { max-width:760px; margin-bottom:38px; }
